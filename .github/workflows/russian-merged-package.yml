name: Merge all Russian translations into one package and upload via FTPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/russian-merged-package-trigger.txt'

permissions:
  contents: write

concurrency:
  group: russian-merged-package-${{ github.ref }}
  cancel-in-progress: false

env:
  FTP_HOST: ftp.navar-abyari.ir
  FTP_PORT: '21'
  FTP_USER: zzz@navar-abyari.ir
  FTP_REMOTE_DIR: /
  FTP_TLS_VERIFY: 'false'

jobs:
  merge-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build single merged Russian package
        run: python automation/build_russian_merged_package.py
      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: russian-all-articles
          path: artifacts/russian-article-queue/merged/
          retention-days: 30
      - name: Upload merged package via FTPS
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "${FTP_PASSWORD:-}" || { echo "::error::FTP_PASSWORD secret is not configured"; exit 1; }
          python automation/upload_russian_merged_ftps.py
      - name: Record merged package state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          m=artifacts/russian-article-queue/merged
          payload="$(mktemp -d)"
          cp "$m/merged-manifest.json" "$m/ftps-upload-state.json" "$payload/"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            mkdir -p "$m"
            cp "$payload/merged-manifest.json" "$payload/ftps-upload-state.json" "$m/"
            git add -f "$m/merged-manifest.json" "$m/ftps-upload-state.json"
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m 'Record merged Russian package upload [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
