name: AFP agri v2 - isolated draft generator
on:
  push:
    branches: [feat/agri-generator-v2-2905-merge593]
    paths:
      - automation/agri_v2/**
      - tests/agri_v2/**
      - data/agri-v2/**
      - .github/workflows/article-content-queue.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Validate offline or explicitly create ONE local draft artifact
        type: choice
        options: [validate, draft]
        default: validate
      topic_id:
        description: Stable topic ID from new queue
        type: string
      brief_path:
        description: Repository-relative approved research brief, no secrets
        type: string
      inventory_path:
        description: Fresh complete title/URL inventory, under 24 hours old
        type: string
        default: data/agri-v2/existing-title-index.json
      confirm_model_calls:
        description: Authorize bounded text and three image API calls for this one draft
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: afp-agri-v2-generator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated:
    if: github.repository == 'getsalet/aghala2' && github.ref == 'refs/heads/feat/agri-generator-v2-2905-merge593'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
      AGNES_API_KEY15: ${{ secrets.AGNES_API_KEY15 }}
      REQUEST_MODE: ${{ inputs.mode }}
      TOPIC_ID: ${{ inputs.topic_id }}
      BRIEF_PATH: ${{ inputs.brief_path }}
      INVENTORY_PATH: ${{ inputs.inventory_path }}
      CONFIRM_CALLS: ${{ inputs.confirm_model_calls }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Offline tests and queue integrity, zero model calls
        run: |
          python -m unittest discover -s tests/agri_v2 -v
          python -m automation.agri_v2 validate
      - name: One draft, only with explicit operator confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'draft'
        run: |
          set -euo pipefail
          test "$CONFIRM_CALLS" = "true"
          python - <<'PY'
          import os,re
          from pathlib import Path
          if not re.fullmatch(r'agri-[a-f0-9]{12}',os.environ['TOPIC_ID']):
              raise SystemExit('Invalid topic ID')
          root=Path.cwd().resolve()
          for key in ['BRIEF_PATH','INVENTORY_PATH']:
              p=Path(os.environ[key]).resolve()
              if root not in p.parents or not p.is_file():
                  raise SystemExit('Input must be an existing repository-relative file')
          PY
          python -m automation.agri_v2 draft --topic-id "$TOPIC_ID" --brief "$BRIEF_PATH" --inventory "$INVENTORY_PATH" --allow-model-calls
      - name: Upload staged artifacts even on partial failure
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'draft'
        uses: actions/upload-artifact@v4
        with:
          name: afp-agri-v2-draft-${{ github.run_id }}
          path: artifacts/agri-v2/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve draft/progress on THIS feature branch only
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'draft'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/agri-generator-v2-2905-merge593"
          test -d artifacts/agri-v2 || exit 0
          rm -f artifacts/agri-v2/.writer.lock
          cp -a artifacts/agri-v2 /tmp/afp-v2-artifacts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git diff --quiet "$GITHUB_SHA" "origin/$GITHUB_REF_NAME" -- artifacts/agri-v2; then
              echo 'Remote draft state changed; preserve upload artifact instead of overwriting.'
              exit 1
            fi
            git reset --hard "origin/$GITHUB_REF_NAME"
            mkdir -p artifacts/agri-v2
            cp -a /tmp/afp-v2-artifacts/. artifacts/agri-v2/
            git add -f artifacts/agri-v2
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Preserve isolated v2 draft progress; no publication [skip ci]'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 3
          done
          exit 1
